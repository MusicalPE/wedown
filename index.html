<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>위 Down · 맨몸으로, 나답게, 바다 끝까지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root{--bg:#EEF4F7;--card:#fff;--line:#DCE7ED;--ink:#0E2A44;--ink2:#2C4A63;--muted:#6B8296;--navy:#0E3A63;--sea:#139AAE;--sea-soft:#E3F4F6}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all;display:grid;place-items:center;min-height:100vh;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:0 1px 2px rgba(14,42,68,.05),0 8px 28px rgba(14,42,68,.07);max-width:520px;width:100%;padding:40px 32px 28px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
  svg.logo{width:140px;height:140px}
  h1{margin:4px 0 0;font-size:40px;font-weight:900;letter-spacing:-.03em;color:var(--navy)}
  .read{font-size:14px;color:var(--muted);letter-spacing:2px;font-weight:600}
  .slogan{font-size:18px;font-weight:700;color:var(--sea)}
  p{margin:0;color:var(--ink2);line-height:1.6}
  .tiers{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .tiers span{padding:7px 14px;border-radius:99px;background:var(--sea-soft);font-size:14px;font-weight:700;color:var(--navy)}
  a.go{display:block;width:100%;margin-top:6px;padding:16px;border-radius:16px;background:var(--navy);color:#fff;text-decoration:none;font-weight:800;font-size:18px;box-shadow:0 6px 18px rgba(14,58,99,.25)}
  a.go:hover{background:#0A2D4E}
  .soon{font-size:13px;color:var(--muted)}
  .madeby{font-size:13px;color:var(--muted)} .madeby b{color:var(--navy)}
</style>
</head>
<body>
<main class="card">
  <svg class="logo" viewBox="0 0 200 200" role="img" aria-label="위 Down 로고">
    <rect width="200" height="200" rx="44" fill="#F1F8FB"/>
    <path d="M12 180 Q31 172 50 180 T88 180 T126 180 T164 180 T190 177" stroke="#5FB8D6" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M40 42 V150 L100 90" stroke="#0E3A63" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M18 128 L40 150" stroke="#0E3A63" stroke-width="20" stroke-linecap="round" fill="none"/>
    <path d="M100 90 L160 150 V50" stroke="#139AAE" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M138 72 L160 50 L182 72" stroke="#139AAE" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </svg>
  <h1>위 Down</h1>
  <div class="read">We Down · 위 다운</div>
  <div class="slogan">맨몸으로, 나답게, 바다 끝까지</div>
  <p>한 번 할 때마다 바다로 40cm씩.<br>우리 학교 맨몸 운동 기록이 곧 이곳에 모여요.</p>
  <div class="tiers"><span>나 Down</span><span>우리 Down</span><span>Without!</span></div>
  <a class="go" href="./checker/">맨몸 판정기 열기</a>
  <div class="soon">우리 학교 기록 페이지는 준비 중이에요</div>
  <div class="madeby">Made by <b>음악적체육인</b></div>
</main>
</body>
</html>
