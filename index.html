<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리 Down · 맨몸 운동 기록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --sky:#DDF0F5; --sky2:#BFE6EF; --mid:#3D86A8; --deep:#123E63; --abyss:#081C31; --night:#0B2A47;
    --navy:#0E3A63; --sea:#139AAE; --sea-ink:#0D7F90; --sea-soft:#E3F4F6; --pale:#9FD8E4;
    --ink:#0E2A44; --ink2:#3C5A70; --muted:#5B7488; --line:#D3E6EE; --card:#FFFFFF; --soft:#F1F8FB; --amber:#F2B33D; --warn:#9A5B0B; --warn-bg:#FFF4E3; --bad:#B2412A;
    --ui:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{background:var(--night);color:var(--ink);font-family:var(--ui);word-break:keep-all;font-feature-settings:"tnum";letter-spacing:-.01em;min-height:100vh}
  button,select,input,textarea{font:inherit}
  button{cursor:pointer;touch-action:manipulation}
  a{color:var(--sea-ink)}
  .wrap{max-width:1232px;margin:0 auto}
  .pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:99px;border:1px solid #9CC6D4;background:transparent;color:var(--navy);font-weight:700;font-size:14px;text-decoration:none}
  .pill.solid{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn{min-height:50px;padding:0 20px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:16px}
  .btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn.sea{background:var(--sea);border-color:var(--sea);color:#fff}
  .btn.danger{color:var(--bad)}
  .btn:disabled{opacity:.45;cursor:default}
  .card{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 10px 30px rgba(14,58,99,.10)}
  .card h2{margin:0;font-size:20px;font-weight:900}
  .hint{font-size:13px;color:var(--muted);margin:0;line-height:1.55}
  .err{color:var(--bad);font-weight:700;font-size:14px}
  .ok{color:var(--sea-ink);font-weight:700;font-size:14px}
  .loading{color:#fff;text-align:center;padding:80px 20px;font-size:18px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy)}
  .brand svg{width:44px;height:44px;flex:none}
  .brand b{font-family:"Black Han Sans",var(--ui);font-weight:400;font-size:26px}
  .brand small{font-size:14px;color:var(--ink2);font-weight:600}
  header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  header.top .sp{flex:1}
  .seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--soft);border-radius:14px;padding:4px}
  .seg button{min-height:44px;border:0;border-radius:11px;background:transparent;color:var(--ink2);font-weight:700}
  .seg button.on{background:var(--navy);color:#fff}
  .seg4{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
  .segg{display:flex;flex-direction:column;gap:6px}
  .sgrp{display:flex;flex-direction:column;gap:3px}
  .sgrp > b{font-size:12px;color:var(--sea-ink);padding-left:4px}
  .dark .gbar{display:grid;grid-template-columns:76px minmax(0,1fr) 52px;gap:8px;align-items:center;font-size:14px}
  .dark .gbar i{display:block;height:10px;border-radius:99px;background:var(--pale)}
  .dark .gbar .tr{height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
  .dark .gbar em{font-style:normal;text-align:right;color:#C9E3EC}
  .dark .gnote{font-size:13px;color:var(--pale);margin:2px 0 0}
  .seg4 button{font-size:14px;padding:0 4px}
  .names{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px}
  .names button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-weight:700;font-size:15px;padding:0 4px}
  .names button.on{background:var(--sea);border-color:var(--sea);color:#fff}
  .ngroups{display:flex;flex-direction:column;gap:10px}
  .ngrp > b{display:block;font-size:12px;color:var(--sea-ink);padding:0 0 4px 4px}
  .pwin{min-height:48px;border-radius:12px;border:1px solid var(--line);padding:8px 14px;font-size:20px;letter-spacing:.2em;text-align:center;color:var(--ink);background:#fff;width:100%;box-sizing:border-box}
  .madeby{font-size:13px;color:var(--pale);text-align:right}
  .madeby b{color:#fff}

  /* 위쪽 밝은 바다 */
  .surface{background:var(--sky);padding:20px 20px 28px}
  .hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,400px);grid-template-areas:"cards go" "gauge go";grid-template-rows:auto 1fr;gap:18px 22px;align-items:start;margin-top:16px}
  .hero > .tri{grid-area:cards;grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch}
  .hero > .gauge{grid-area:gauge} .hero > .go{grid-area:go}
  .note{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;margin-top:16px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--sea);border-radius:14px;padding:10px 16px}
  .note > div:first-child{flex:1 1 300px;min-width:0}
  .note .ne{font-size:12px;font-weight:700;color:var(--sea-ink)}
  .note p{margin:0;font-size:16px;font-weight:700;color:var(--ink)}
  .note .nstat{display:flex;gap:16px;font-size:14px;color:var(--ink2);white-space:nowrap}
  .note .nstat b{font-size:18px;color:var(--navy)}
  .tri.top .dark{padding:16px}
  .tri.top .row{font-size:14px} .tri.top .row > span:first-child{white-space:nowrap} .tri.top .row > :last-child{text-align:right}
  .tri.top .recs{display:flex;flex-direction:column;gap:8px;max-height:190px;overflow:auto}
  .tri.top .rec{gap:8px} .tri.top .rec span:first-child{width:38px;font-size:12px} .tri.top .rec span:nth-child(3){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  @media (max-width:1100px){ .hero > .tri{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))} }
  @media (max-width:900px){ .hero{grid-template-columns:minmax(0,1fr);grid-template-areas:"gauge" "go" "cards"} }
  .gauge{display:flex;gap:18px;flex:999 1 560px;min-width:0}
  .ruler{width:58px;flex:none;position:relative;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .ruler i{display:block}
  .ruler .mark{position:absolute;left:-4px;right:-4px;height:8px;border-radius:99px;background:var(--amber);box-shadow:0 0 0 3px rgba(242,179,61,.3)}
  .rlabels{position:relative;width:190px;flex:none;font-size:13px;color:var(--ink2);font-weight:700}
  .rlabels span{position:absolute;left:0;transform:translateY(-50%);white-space:nowrap}
  .depthbig{display:flex;flex-direction:column;justify-content:center;gap:8px;min-width:0}
  .depthbig .k{font-size:16px;font-weight:700;color:var(--sea-ink)}
  .depthbig .v{font-size:clamp(64px,10vw,108px);font-weight:900;line-height:.9;letter-spacing:-.05em;color:var(--navy)}
  .depthbig .v small{font-size:.34em}
  .depthbig .n{font-size:17px;font-weight:700}
  .depthbig .n em{font-style:normal;color:var(--sea-ink)}
  .depthbig .s{font-size:14px;color:var(--ink2)}
  .go{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:12px}
  .go .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .go .plan{font-size:13px;color:var(--ink2);font-weight:700}

  /* 다이빙 줄 */
  .ropes{background:#fff;padding:24px 20px 28px}
  .ropes .title{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:14px}
  .ropes h2{margin:0;font-size:22px;font-weight:900}
  .ropes .title span{font-size:14px;color:var(--ink2)}
  .rbox{overflow-x:auto}
  .rchart{position:relative;height:360px;border-radius:18px;background:#E9F5F8;overflow:hidden}
  .rchart .surf{position:absolute;left:0;right:0;top:40px;height:4px;background:#5FB8D6}
  .rchart .tick{position:absolute;left:0;right:0;border-top:1px dashed #B8D7E1}
  .rchart .tick span{position:absolute;left:12px;top:-18px;font-size:12px;color:var(--muted);font-weight:700}
  .rcols{position:absolute;left:60px;right:16px;top:8px;bottom:0;display:grid}
  .rcol{display:flex;flex-direction:column;align-items:center;min-width:0}
  .rcol b{font-size:14px;height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .rcol .line{width:3px;background:var(--navy)}
  .rcol .dot{width:20px;height:20px;border-radius:50%;background:var(--navy);border:3px solid #fff;margin-top:-4px}
  .rcol .m{font-size:12px;font-weight:700;color:var(--sea-ink);margin-top:4px;white-space:nowrap}
  .rcol.today .dot{background:var(--sea)}
  .empty{padding:40px;text-align:center;color:var(--muted)}

  /* 아래 깊은 바다 */
  .abyss{padding:18px 20px 22px}
    .tri{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
  .dark{background:var(--deep);border-radius:20px;padding:20px;color:#fff;display:flex;flex-direction:column;gap:10px}
  .dark h2{margin:0;font-size:18px;font-weight:900;color:var(--pale)}
  .dark .row{display:flex;justify-content:space-between;gap:8px;font-size:15px}
  .dark .msg{margin:0;font-size:18px;line-height:1.55;font-weight:700}
  .dark .rec{display:flex;gap:10px;font-size:14px;align-items:baseline}
  .dark .rec span:first-child{color:var(--pale);width:42px;flex:none}
  .dark .rec em{font-style:normal;margin-left:auto;font-weight:700;white-space:nowrap}
  .dark .stat{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:#C9E3EC}
  .dark .stat b{color:#fff;font-size:20px}

  /* 관리자·운동방·입장 (밝은 화면) */
  .page{background:var(--sky);min-height:100vh;padding:20px}
  .grid2{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;margin-top:18px}
  .grid2 > .side{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:16px}
  .grid2 > .main{flex:999 1 600px;min-width:0;display:flex;flex-direction:column;gap:16px}
  label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2);font-weight:700}
  label.f input,label.f select,label.f textarea{min-height:44px;border-radius:12px;border:1px solid var(--line);padding:8px 12px;font-size:16px;color:var(--ink);background:#fff}
  label.f textarea{min-height:140px;resize:vertical}
  .row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .list{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto}
  .list .it{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--soft);font-size:14px}
  .list .it .sp{flex:1}
  .list .it button{min-height:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;color:var(--ink2)}
  .qr{width:200px;height:200px;display:grid;place-items:center;margin:0 auto;background:#fff;padding:8px;border-radius:12px}
  .code{font-size:40px;font-weight:900;letter-spacing:.12em;color:var(--navy);text-align:center}
  .bar{height:14px;border-radius:99px;background:#E3EEF3;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--sea);border-radius:99px;transition:width .4s}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .tile{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:#fff;border:1px solid var(--line)}
  .tile.done{background:var(--sea-soft);border:2px solid var(--sea)}
  .tile.away{background:var(--soft);border:1px dashed #B8CBD6;opacity:.7}
  .tile .h{display:flex;justify-content:space-between;align-items:center;gap:6px}
  .tile .h b{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--soft);color:var(--sea-ink);white-space:nowrap}
  .tile.done .chip{background:var(--navy);color:#fff}
  .segs{display:grid;gap:4px}
  .segs i{display:block;height:10px;border-radius:99px;background:#E3EEF3}
  .segs i.on{background:var(--sea)}
  .center{max-width:520px;margin:30px auto 0;display:flex;flex-direction:column;gap:16px}
  .bigtask{font-size:clamp(26px,6vw,40px);font-weight:900;color:var(--navy);text-align:center;line-height:1.25}
  .wait{display:flex;align-items:center;justify-content:center;gap:10px;font-size:18px;font-weight:700;color:var(--ink2);padding:18px}
  .wait i{width:12px;height:12px;border-radius:50%;background:var(--sea);animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.6);opacity:.4}}
  .peers{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
  .peer{display:flex;flex-direction:column;gap:5px;padding:8px 10px;border-radius:12px;background:var(--soft);font-size:13px;font-weight:700;color:var(--ink2)}
  .peer.done{background:var(--sea-soft);color:var(--navy)}
  .peer span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .peer .segs i{height:6px}
  .warnbox{background:var(--warn-bg);color:var(--warn);font-weight:700;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5}
  /* 관리자: 왼쪽 메뉴 (좁은 화면은 위쪽 가로 메뉴) */
  .alayout{display:flex;gap:18px;align-items:flex-start;margin-top:18px}
  .anav{flex:none;width:200px;position:sticky;top:16px;background:var(--card);border-radius:20px;box-shadow:0 10px 30px rgba(14,58,99,.10);padding:8px;display:flex;flex-direction:column;gap:2px}
  .anav button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:12px;background:transparent;color:var(--ink2);font-weight:700;font-size:15px;text-align:left;cursor:pointer}
  .anav button i{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
  .anav button em{margin-left:auto;font-style:normal;font-size:12px;color:var(--muted);background:var(--soft);border-radius:99px;padding:2px 8px}
  .anav button:hover{background:var(--soft);color:var(--ink)}
  .anav button.on{background:var(--sea-soft);color:var(--navy)}
  .anav button.on i{background:var(--sea)}
  .anav .nsep{height:1px;background:var(--line);margin:6px 4px}
  .anav a{color:var(--muted);font-size:13px;font-weight:700;text-decoration:none;padding:8px 12px}
  .anav a:hover{color:var(--sea-ink)}
  .acontent{flex:1;min-width:0}
  .apane{display:none;flex-direction:column;gap:16px}
  .apane.on{display:flex}
  .acard{display:flex;flex-direction:column;gap:12px}
  .arow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .arow .btn{min-height:44px;font-size:15px}
  .preview{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--ink2)}
  .preview b{color:var(--navy)}
  .qrmini{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .qrmini .qr{width:184px;height:184px;margin:0;border:1px solid var(--line)}
  .qrinfo{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:10px}
  .qrinfo .url{font-size:13px;word-break:break-all;background:var(--soft);border-radius:10px;padding:8px 12px;color:var(--ink2)}
  .list.tall{max-height:560px}
  .row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  textarea.mono{font-family:Consolas,'Courier New',monospace;font-size:14px}
  .stbl{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:14px}
  .stbl table{width:100%;border-collapse:collapse;font-size:14px}
  .stbl th{position:sticky;top:0;background:var(--soft);color:var(--ink2);font-size:12px;text-align:left;padding:8px;white-space:nowrap;z-index:1}
  .stbl td{padding:5px 6px;border-top:1px solid var(--line);vertical-align:middle}
  .stbl td input:not([type=checkbox]){width:100%;min-width:44px;box-sizing:border-box;min-height:36px;border:1px solid transparent;border-radius:8px;padding:4px 8px;font-size:14px;background:transparent;color:var(--ink)}
  .stbl td input:hover,.stbl td input:focus{border-color:var(--line);background:#fff}
  .stbl td input.nm{min-width:90px;font-weight:700}
  .stbl tr td:nth-child(-n+3){width:58px}
  .stbl .nopw{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);padding-left:8px;white-space:nowrap}
  .stbl .acts{white-space:nowrap;text-align:right}
  .stbl .acts button{min-height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;color:var(--ink2);margin-left:4px}
  .stbl .acts .sv{display:none;background:var(--navy);border-color:var(--navy);color:#fff}
  .stbl tr.dirty{background:#FFFBEF} .stbl tr.dirty .sv{display:inline-block}
  .stbl .pv td{padding:7px 8px} .stbl tr.skip td{color:var(--muted);text-decoration:line-through} .stbl tr.skip td:last-child{text-decoration:none;color:var(--warn)}
  .list .num{width:28px;color:var(--muted)}
  .list .when{color:var(--muted);width:92px}
  .qrfull{position:fixed;inset:0;background:rgba(7,26,46,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:50;color:#fff}
  .qrfull.on{display:flex}
  .qrfull .qrbox{background:#fff;padding:16px;border-radius:20px}
  .qrfull b{font-size:24px} .qrfull span{font-size:14px;color:var(--pale)}
  @media (max-width:760px){
    .alayout{flex-direction:column}
    .anav{width:100%;position:static;flex-direction:row;overflow-x:auto;gap:4px;padding:6px}
    .anav button{width:auto;flex:none;white-space:nowrap}
    .anav .nsep,.anav a{display:none}
  }
  @media (max-width:700px){
    .surface,.ropes,.abyss,.page{padding-left:12px;padding-right:12px}
    .brand b{font-size:22px} .brand svg{width:38px;height:38px}
    .gauge{gap:10px;flex-wrap:wrap} .ruler{width:40px} .rlabels{width:170px;font-size:12px} .depthbig{flex:1 1 100%;order:-1}
    .rcols{left:44px}
    .rchart .tick span{left:6px}
  }
</style>
</head>
<body>
<div id="app"><div class="loading">불러오는 중…</div></div>

<script>
/* ===================== 기본 ===================== */
const VER = '0.8.0', NEED_SHELL = 2, REP_M = 0.4;
const EXN = { squat: '스쿼트', jack: '점핑잭', lunge: '런지', burpee: '버피', pushup: '팔굽혀펴기', situp: '윗몸일으키기', plank: '플랭크', highknee: '무릎 높이 들기', balance: '외발 서기', climber: '마운틴 클라이머', legraise: '레그 레이즈', wallpush: '벽 팔굽혀펴기', kneepush: '무릎 팔굽혀펴기' };
const EXK = ['squat', 'jack', 'lunge', 'burpee', 'pushup', 'situp', 'plank', 'highknee', 'balance', 'climber', 'legraise', 'wallpush', 'kneepush'];
const GROUPS = [['다리·엉덩이', ['squat', 'lunge']], ['팔·가슴', ['wallpush', 'kneepush', 'pushup']], ['배(코어)', ['situp', 'legraise', 'plank']], ['균형', ['balance']], ['유산소', ['jack', 'highknee', 'burpee', 'climber']]];
const isT = function(x){ return x === 'plank' || x === 'balance'; };   // 시간으로 세는 종목
const secLabel = function(v){ return v >= 60 ? (v / 60 | 0) + '분' + (v % 60 ? ' ' + v % 60 + '초' : '') : v + '초'; };
const taskText = function(t){ return EXN[t.ex] + ' ' + (isT(t.ex) ? secLabel(t.reps) : t.reps + '회') + ' × ' + t.sets + '세트'; };
const grpName = function(s){ return (s.grade !== '' && s.grade != null ? s.grade + '학년 ' : '') + (s.cls !== '' && s.cls != null ? s.cls + '반' : ''); };
// 이름 단추: 학년·반이 둘 이상이면 반마다 묶어서 보여 줌
function nameGrid(list, cur){
  const btn = function(s){ return '<button data-sid="' + esc(s.id) + '" data-name="' + esc(s.name) + '" class="' + (s.id === cur ? 'on' : '') + '">' + esc(s.name) + '</button>'; };
  const keys = []; const by = {};
  list.forEach(function(s){ const k = grpName(s).trim(); if (!by[k]) { by[k] = []; keys.push(k); } by[k].push(s); });
  if (keys.length < 2) return '<div class="names" id="names">' + list.map(btn).join('') + '</div>';
  return '<div id="names" class="ngroups">' + keys.map(function(k){ return '<div class="ngrp"><b>' + esc(k || '반 없음') + '</b><div class="names">' + by[k].map(btn).join('') + '</div></div>'; }).join('') + '</div>';
}
function exSeg(cur, idp){ return '<div class="segg">' + GROUPS.map(function(g){ return '<div class="sgrp"><b>' + g[0] + '</b><div class="seg seg4">' + g[1].map(function(k){ return '<button data-' + idp + '="' + k + '" class="' + (k === cur ? 'on' : '') + '">' + EXN[k] + '</button>'; }).join('') + '</div></div>'; }).join('') + '</div>'; }
const Q = {}; new URLSearchParams(location.search).forEach(function(v, k){ Q[k] = v; });
const APP = { shell: '' };
(function(){ let s = Q.s || ''; try { if (s) localStorage.setItem('wd_shell', s); else s = localStorage.getItem('wd_shell') || ''; } catch (e) {} APP.shell = s; })();
const ROOT = location.origin + location.pathname.replace(/index\.html$/, '');
function link(page, extra){ const u = new URL(ROOT); if (APP.shell) u.searchParams.set('s', APP.shell); if (page && page !== 'main') u.searchParams.set('page', page); Object.keys(extra || {}).forEach(function(k){ if (extra[k] !== '' && extra[k] != null) u.searchParams.set(k, extra[k]); }); return u.toString(); }
const $ = function(id){ return document.getElementById(id); };
const esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
const fmt = function(n){ return Number(n || 0).toLocaleString('ko-KR'); };
const meters = function(n){ const m = n * REP_M; return m >= 100 ? fmt(Math.round(m)) : m.toFixed(1).replace(/\.0$/, ''); };
function store(k, v){ try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }

/* 학교 껍데기(Shell.gs)에 요청 — 구글이 잠깐 오류를 내면 한 번 더 */
function rpc(fn, args, retried){
  return fetch(APP.shell, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args || [] }), redirect: 'follow' })
    .then(function(r){ if (!r.ok) { const e = new Error('학교 시트 응답 오류 (' + r.status + ')'); e.retry = true; throw e; } return r.json(); }, function(e){ e.retry = true; throw e; })
    .then(function(j){ if (!j.ok) throw new Error(j.error || '요청 실패'); return j.result; })
    .catch(function(e){ if (!e.retry || retried) throw e; return new Promise(function(ok){ setTimeout(ok, 1500); }).then(function(){ return rpc(fn, args, true); }); });
}

const MILES = [[0, '0m 물 위'], [200, '200m 햇빛 끝'], [1000, '1,000m 심해 시작'], [3800, '3,800m 타이타닉'], [6000, '6,000m 해구 시작'], [11000, '11,000m 마리아나 해구 바닥']];

function depthPx(m){ let y = 0; for (const s of SEGS){ if (m <= s[1]) return y + (Math.max(0, m - s[0]) / (s[1] - s[0])) * s[2]; y += s[2]; } return y; }

/* 이번 주 부위별 — 골고루 하도록 가장 적은 묶음을 알려 줌 (값은 회 단위, 시간 종목은 2초 = 1회) */
function weekGroupsCard(g){
  if (!g.length) return '';
  const max = Math.max(1, ...g.map(function(x){ return x.value; })), sum = g.reduce(function(a, x){ return a + x.value; }, 0);
  const low = sum > 0 ? g.slice().sort(function(a, b){ return a.value - b.value; })[0] : null;
  return '<section class="dark"><h2>이번 주 부위별</h2>' + g.map(function(x){ return '<div class="gbar"><span>' + esc(x.name) + '</span><div class="tr"><i style="width:' + (x.value / max * 100).toFixed(1) + '%"></i></div><em>' + fmt(Math.round(x.value)) + '회</em></div>'; }).join('') +
    '<p class="gnote">' + (low ? esc(low.name) + ' 운동이 조금 적어요. 골고루 해 봐요!' : '이번 주 첫 운동을 기다려요') + '</p></section>';
}
function checkerUrl(student, task, room, back){
  const u = new URL(ROOT + 'checker/');
  u.searchParams.set('s', APP.shell); u.searchParams.set('sid', student.id); u.searchParams.set('name', student.name);
  u.searchParams.set('ex', task.ex); u.searchParams.set('reps', task.reps); u.searchParams.set('sets', task.sets); u.searchParams.set('rest', task.rest);
  if (room) { u.searchParams.set('room', room); u.searchParams.set('task', task.id); }
  u.searchParams.set('back', back);
  return u.toString();
}

    const seen = {};
    return String(text || '').split(/\r?\n/).map(function(line){
      const cells = line.split(/\t|,|\s+/).map(function(x){ return x.trim(); }).filter(Boolean);
      if (!cells.length) return null;
      if (cells.some(function(c){ return /^(학년|반|번호|이름|비밀번호.*)$/.test(c); })) return null;   // 제목 줄

  $('oneAdd').onclick = function(){ const r = { grade: $('oGrade').value.trim(), cls: $('oCls').value.trim(), number: $('oNum').value.trim(), name: $('oName').value.trim(), pw: $('oPw').value.trim() }; if (!r.name) { $('oneOk').textContent = '이름을 넣어 주세요'; return; } $('oneAdd').disabled = true;
    rpc('addStudentsBulk', [token(), [r]]).then(function(x){ $('oneOk').textContent = x.added ? r.name + ' 학생을 추가했어요' : '이미 있는 학생이에요'; setTimeout(loadAdmin, 900); }).catch(function(e){ if (!authFail(e, 'admin')) { $('oneOk').textContent = e.message; $('oneAdd').disabled = false; } }); };

let ROOM = { timer: 0, code: '', settings: null, task: null };
function loadRoom(){
  if (!token()) return needLogin('room');
  Promise.all([rpc('roomOpen', [token()]), rpc('getPublic')]).then(function(r){ ROOM.code = r[0].code; ROOM.settings = r[1]; renderRoomShell(); pollRoom(); })
    .catch(function(e){ if (!authFail(e, 'room')) $('app').innerHTML = '<div class="loading">운동방을 열지 못했어요: ' + esc(e.message) + '</div>'; });
}
function renderRoomShell(){
  const s = ROOM.settings;
  const opt = function(list, v, unit){ return list.map(function(x){ return '<option value="' + x + '"' + (Number(v) === x ? ' selected' : '') + '>' + x + unit + '</option>'; }).join(''); };
  const joinUrl = link('join', { code: ROOM.code });
  $('app').innerHTML = '<div class="page"><div class="wrap">' +
  '<header class="top">' + brand(s.className + ' 운동방') + '<span class="sp"></span><b id="joinedCount" style="color:var(--sea-ink)"></b><a class="pill" href="' + link('main') + '">메인 보기</a><button class="pill" id="closeRoom">방 닫기</button></header>' +
  '<div class="grid2"><div class="side">' +
    '<section class="card" style="display:flex;flex-direction:column;gap:10px;text-align:center"><h2>휴대폰으로 찍고 들어와요</h2><div class="qr" id="roomQr"></div><div class="hint">방 번호</div><div class="code">' + ROOM.code.split('').join(' ') + '</div><p class="hint">메인 화면 주소 뒤에 들어오거나, 입장 화면에서 방 번호를 넣어도 돼요</p></section>' +
    '<section class="card" style="display:flex;flex-direction:column;gap:12px"><h2>과제 보내기</h2>' +
      exSeg('squat', 'tex') +
      '<div class="row3"><label class="f"><span id="tRepsLab">횟수</span><select id="tReps">' + opt([5, 8, 10, 12, 15, 20, 25, 30], s.reps, '회') + '</select></label><label class="f">세트<select id="tSets">' + opt([1, 2, 3, 4, 5], s.sets, '세트') + '</select></label><label class="f">쉬기<select id="tRest">' + opt([10, 15, 20, 30, 45, 60], s.rest, '초') + '</select></label></div>' +
      '<button class="btn sea" id="sendTask">모두에게 보내기</button><span class="ok" id="sendOk"></span>' +
      '<p class="hint">각자 기기에서 카메라로 하고, 세트를 마칠 때마다 여기에 알려 줘요. 방 자료는 시트에 쓰지 않고 임시로만 두었다가 몇 시간 뒤 저절로 사라져요. 다 마친 결과만 기록에 남아요.</p></section>' +
  '</div><div class="main"><section class="card" style="display:flex;flex-direction:column;gap:14px"><div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:10px"><h2 id="taskTitle">아직 보낸 과제가 없어요</h2><span class="hint" id="taskSum"></span></div><div class="bar"><i id="taskBar" style="width:0%"></i></div><div class="tiles" id="tiles"></div><p class="hint">칸 하나 = 1세트 완료 · 숫자는 보내지 않고 세트를 마쳤다는 신호만 와요 · 3초마다 새로 고쳐요</p></section></div></div>' +
  '</div></div>';
  try { new QRCode($('roomQr'), { text: joinUrl, width: 184, height: 184, colorDark: '#0E3A63', colorLight: '#ffffff' }); } catch (e) { $('roomQr').textContent = 'QR을 만들지 못했어요'; }
  let tex = 'squat';
  document.querySelectorAll('[data-tex]').forEach(function(b){ b.onclick = function(){ const was = tex; tex = b.getAttribute('data-tex'); document.querySelectorAll('[data-tex]').forEach(function(x){ x.classList.toggle('on', x === b); });
    if (isT(was) !== isT(tex)) { $('tRepsLab').textContent = isT(tex) ? '시간' : '횟수'; $('tReps').innerHTML = isT(tex) ? [10, 15, 20, 30, 45, 60, 90, 120, 180].map(function(x){ return '<option value="' + x + '"' + (x === (s.plankSec || 30) ? ' selected' : '') + '>' + secLabel(x) + '</option>'; }).join('') : opt([5, 8, 10, 12, 15, 20, 25, 30], s.reps, '회'); } }; });
  $('sendTask').onclick = function(){
    if (ROOM.task && !confirm('새 과제를 보내면 지금 과제의 진행 표시가 처음부터 다시 시작돼요. 보낼까요?')) return;
    $('sendTask').disabled = true;
    rpc('roomSendTask', [token(), { ex: tex, reps: +$('tReps').value, sets: +$('tSets').value, rest: +$('tRest').value }]).then(function(t){ $('sendOk').textContent = taskText(t) + '를 보냈어요'; $('sendTask').disabled = false; pollRoom(); })
      .catch(function(e){ if (!authFail(e, 'room')) { $('sendOk').textContent = e.message; $('sendTask').disabled = false; } });
  };
  $('closeRoom').onclick = function(){ if (!confirm('운동방을 닫을까요? 들어온 학생들의 진행 표시가 모두 사라져요. (끝낸 기록은 남아요)')) return; clearTimeout(ROOM.timer); rpc('roomClose', [token()]).then(function(){ location.href = link('main'); }).catch(function(e){ alert(e.message); }); };
}
function pollRoom(){
  clearTimeout(ROOM.timer);
  rpc('roomStatus', [token()]).then(function(r){
    if (!r.open) { $('taskTitle').textContent = '운동방이 닫혔어요'; return; }
    ROOM.task = r.task;
    const n = r.task ? r.task.sets : 3;
    const joined = r.members.filter(function(m){ return m.joined; }).length;
    const done = r.members.filter(function(m){ return m.finished; }).length;
    const doing = r.members.filter(function(m){ return m.joined && !m.finished && m.setsDone > 0; }).length;
    $('joinedCount').textContent = r.members.length + '명 중 ' + joined + '명 들어옴';
    if (r.task) { $('taskTitle').textContent = '지금 과제 · ' + taskText(r.task); $('taskSum').textContent = '끝 ' + done + '명 · 하는 중 ' + doing + '명 · 아직 ' + (joined - done - doing) + '명'; }
    const totalSets = r.members.filter(function(m){ return m.joined; }).length * n;
    const doneSets = r.members.reduce(function(a, m){ return a + (m.finished ? n : m.setsDone); }, 0);
    $('taskBar').style.width = (totalSets ? doneSets / totalSets * 100 : 0).toFixed(1) + '%';
    $('tiles').innerHTML = r.members.map(function(m){
      const state = !m.joined ? '안 들어옴' : m.finished ? '끝!' : m.setsDone ? m.setsDone + '세트 완료' : (r.task ? '과제 받음' : '들어옴');
      let segs = ''; for (let i = 1; i <= n; i++) segs += '<i class="' + ((m.finished || m.setsDone >= i) ? 'on' : '') + '"></i>';
      return '<div class="tile ' + (!m.joined ? 'away' : m.finished ? 'done' : '') + '"><div class="h"><b>' + esc(m.name) + '</b><span class="chip">' + state + '</span></div>' + (r.task ? '<div class="segs" style="grid-template-columns:repeat(' + n + ',minmax(0,1fr))">' + segs + '</div>' : '') + '</div>';
    }).join('');
  }).catch(function(e){ if (authFail(e, 'room')) return; }).then(function(){ if ($('tiles')) ROOM.timer = setTimeout(pollRoom, 3000); });
}

/* ===================== 입장 (학생) ===================== */
let JOIN = { code: '', sid: '', name: '', timer: 0 };
function loadJoin(){
  JOIN.code = Q.code || store('wd_join_code') || '';
  JOIN.sid = store('wd_join_sid') || ''; JOIN.name = store('wd_join_name') || '';
  if (!JOIN.code) return askCode();
  rpc('roomInfo', [JOIN.code]).then(function(info){
    store('wd_join_code', JOIN.code);
    if (JOIN.sid && info.students.some(function(s){ return s.id === JOIN.sid; })) return joined();
    pickName(info);
  }).catch(function(e){ store('wd_join_code', null); askCode(e.message); });
}
function askCode(msg){
  $('app').innerHTML = '<div class="page"><div class="wrap center"><div class="card" style="display:flex;flex-direction:column;gap:12px">' + brand('운동방') + '<h2>방 번호를 넣어요</h2>' + (msg ? '<div class="warnbox">' + esc(msg) + '</div>' : '') +
    '<label class="f">방 번호 (네 자리)<input id="code" inputmode="numeric" maxlength="4" style="font-size:28px;text-align:center;letter-spacing:.2em"></label><button class="btn primary" id="enter">들어가기</button></div></div></div>';
  $('enter').onclick = function(){ const c = $('code').value.trim(); if (!/^\d{4}$/.test(c)) return; Q.code = c; loadJoin(); };
}
function pickName(info){
  $('app').innerHTML = '<div class="page"><div class="wrap center"><div class="card" style="display:flex;flex-direction:column;gap:12px">' + brand(info.className + ' 운동방') + '<h2>내 이름을 눌러요</h2>' +
    nameGrid(info.students, '') + '<div id="pwStep" style="display:none;flex-direction:column;gap:10px"><p class="hint" id="pwWho"></p><input class="pwin" id="joinPw" type="password" inputmode="numeric" autocomplete="off" placeholder="내 비밀번호"><button class="btn primary" id="pwGo">들어가기</button></div><span class="err" id="joinErr"></span></div></div></div>';
  document.querySelectorAll('#names button').forEach(function(b){ b.onclick = function(){
    const s = info.students.find(function(x){ return x.id === b.getAttribute('data-sid'); });
    JOIN.sid = s.id; JOIN.name = s.name;
    document.querySelectorAll('#names button').forEach(function(x){ x.classList.toggle('on', x === b); });
    if (!s.hasPw) { store('wd_join_sid', JOIN.sid); store('wd_join_name', JOIN.name); store('wd_join_pw', null); return joined(); }
    $('pwStep').style.display = 'flex'; $('pwWho').innerHTML = '<b>' + esc(s.name) + '</b>, 비밀번호를 넣어요'; $('joinErr').textContent = ''; $('joinPw').value = ''; $('joinPw').focus();
  }; });
  $('joinPw').onkeydown = function(e){ if (e.key === 'Enter') $('pwGo').click(); };
  $('pwGo').onclick = function(){ const pw = $('joinPw').value; $('pwGo').disabled = true;
    rpc('roomJoin', [JOIN.code, JOIN.sid, pw]).then(function(r){ store('wd_join_sid', JOIN.sid); store('wd_join_name', JOIN.name); store('wd_join_pw', pw); showJoin(r); })
      .catch(function(e){ $('joinErr').textContent = e.message; $('pwGo').disabled = false; }); };
}
function joined(){
  rpc('roomJoin', [JOIN.code, JOIN.sid, store('wd_join_pw') || '']).then(showJoin).catch(function(e){ if (/비밀번호/.test(e.message)) { store('wd_join_sid', null); store('wd_join_pw', null); return loadJoin(); } store('wd_join_code', null); askCode(e.message); });
}
function showJoin(r){
  clearTimeout(JOIN.timer);
  const t = r.task, me = r.me || {};
  const mine = t && me.task === t.id;
  let body;
  if (!t) body = '<div class="wait"><i></i>선생님이 과제를 보내면 시작해요</div>';
  else if (mine && me.finished) body = '<div class="bigtask">끝! 잘했어요</div><p class="hint" style="text-align:center">' + taskText(t) + '를 다 했어요. 다음 과제를 기다려요.</p><div class="wait"><i></i>다음 과제 기다리는 중</div>';
  else body = '<p class="hint" style="text-align:center">선생님이 보낸 과제</p><div class="bigtask">' + EXN[t.ex] + '<br>' + (isT(t.ex) ? secLabel(t.reps) : t.reps + '회') + ' × ' + t.sets + '세트</div><p class="hint" style="text-align:center">쉬는 시간 ' + t.rest + '초' + (mine && me.setsDone ? ' · 지난번에 ' + me.setsDone + '세트까지 했어요' : '') + '</p><button class="btn sea" id="startTask" style="min-height:60px;font-size:20px">카메라로 시작하기</button>';
  $('app').innerHTML = '<div class="page"><div class="wrap center"><div class="card" style="display:flex;flex-direction:column;gap:14px">' + brand('운동방 ' + JOIN.code) +
    '<div style="display:flex;justify-content:space-between;align-items:center"><h2>' + esc(JOIN.name) + '</h2><button class="pill" id="notMe">내가 아니에요</button></div>' + body + '</div>' +
    peersCard(r.peers || [], t) + '</div></div>';
  $('notMe').onclick = function(){ store('wd_join_pw', null); store('wd_join_sid', null); store('wd_join_name', null); JOIN.sid = ''; loadJoin(); };
  if ($('startTask')) $('startTask').onclick = function(){ location.href = checkerUrl({ id: JOIN.sid, name: JOIN.name }, t, JOIN.code, link('join', { code: JOIN.code })); };
  JOIN.timer = setTimeout(function(){ rpc('roomPoll', [JOIN.code, JOIN.sid]).then(function(nr){ if (!nr.me) return joined(); showJoin(nr); }).catch(function(e){ askCode(e.message); }); }, 3000);
}

/* 함께 들어온 친구들 — 번호 순으로 고정(누가 빠른지 겨루는 게 아니라 함께 하는 걸 보여 줌) */
function peersCard(peers, t){
  if (!peers.length) return '';
  const n = t ? t.sets : 0;
  return '<div class="card" style="display:flex;flex-direction:column;gap:10px;padding:16px"><h2 style="font-size:16px">함께 하는 친구들 ' + peers.length + '명</h2><div class="peers">' + peers.map(function(p){
    let segs = ''; for (let i = 1; i <= n; i++) segs += '<i class="' + ((p.finished || p.setsDone >= i) ? 'on' : '') + '"></i>';
    return '<div class="peer' + (p.finished ? ' done' : '') + '"><span>' + esc(p.name) + (p.finished ? ' · 끝' : '') + '</span>' + (n ? '<div class="segs" style="grid-template-columns:repeat(' + n + ',minmax(0,1fr))">' + segs + '</div>' : '') + '</div>';
  }).join('') + '</div></div>';
}

/* ===================== 길 찾기 ===================== */
function route(){
  if (!APP.shell) return showSetup('');
  const p = Q.page || 'main';
  if (p === 'admin') return loadAdmin();
  if (p === 'room') return loadRoom();
  if (p === 'join') return loadJoin();
  loadMain();
}
route();
</script>
